<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Trading Journal</title>
<style>
:root{
  --bg:#060708; --bg2:#0d0e10; --surface:#141518; --surface2:#1b1d21;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.10);
  --text:#f2f3f5; --muted:#8a8f98; --muted2:#565a61;
  --blue:#3b82f6; --blue2:#2563eb; --blueSoft:rgba(59,130,246,.14);
  --win:#3fb860; --loss:#e5484d; --gold:#3b82f6;
  --r:16px; --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.mono{font-family:var(--mono)}
.win{color:var(--win)} .loss{color:var(--loss)} .muted{color:var(--muted)} .blue{color:var(--blue)}
.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;transition:transform .12s,opacity .12s,background .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#5b9df8,#2e6fe0);color:#fff}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:rgba(229,72,77,.12);color:var(--loss);border:1px solid rgba(229,72,77,.3)}
.btn:disabled{opacity:.45;cursor:default}
.label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--text);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.15);background-size:cover;background-position:center}
.chip{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#5b9df8,#2e6fe0);color:#fff;border-color:transparent}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--win)}
.sync.busy .dot{background:#e6a23c} .sync.off .dot{background:var(--loss)}
h1.page{font-size:24px;font-weight:600;margin:0}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.tile:active{transform:scale(.99)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--blueSoft);display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none}

/* layout */
#app{display:none;min-height:100%}
.shell{display:flex;min-height:100vh}
.side{width:230px;flex:none;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700}
.side .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b9df8,#2e6fe0);display:flex;align-items:center;justify-content:center}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.navitem.on{background:var(--blueSoft);color:var(--blue)}
.navitem svg{width:20px;height:20px}
.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:24px 32px 70px;width:100%}
.dash{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#view-history,#view-objectives,#view-econ,#view-friends,#view-settings{max-width:780px;margin:0 auto}
@media(min-width:1080px){
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .dash>.span2{grid-column:1 / -1}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
.bottombar{display:none}

@media(max-width:860px){
  .side{display:none}
  .main{max-width:100%;padding:14px 14px 96px}
  .bottombar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:rgba(20,21,24,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:999px;padding:8px 6px;align-items:center;justify-content:space-around;z-index:50}
  .bottombar .navitem{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;border-radius:999px}
  .bottombar .navitem.on{background:transparent;color:var(--blue)}
  .bottombar .navitem svg{width:21px;height:21px}
  .bottombar .add{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#5b9df8,#2e6fe0);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
}
.addfab{display:none}
@media(min-width:861px){ .side .addbtn{margin-top:8px} }

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media(min-width:861px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px}
@media(min-width:861px){.modal{border-radius:20px}}
.modal h2{margin:0 0 4px;font-size:18px}
.modalhead{display:flex;align-items:center;margin-bottom:16px}

/* equity */
svg.equity{width:100%;height:190px;display:block;overflow:visible}
.eq-tip{position:absolute;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;font-size:12px;pointer-events:none;transform:translate(-50%,-135%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:3}
.eq-wrap{position:relative;touch-action:none}
.eq-guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none;opacity:0;z-index:1}
.eq-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#3b82f6;border:2px solid var(--bg2);transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}
.bars>div{flex:1;border-radius:3px 3px 0 0;min-height:2px}

table{width:100%;border-collapse:collapse}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;z-index:200;font-size:14px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* ---- thème clair ---- */
html[data-theme="light"]{--bg:#f3f4f6;--bg2:#ffffff;--surface:#ffffff;--surface2:#edeff2;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.12);--text:#111317;--muted:#6b7280;--muted2:#a2a8b0}
html[data-theme="light"] .bottombar{background:rgba(255,255,255,.85)}
/* ---- segmenté ---- */
.seg{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s}
.seg button.on{background:linear-gradient(135deg,#5b9df8,#2e6fe0);color:#fff;font-weight:700}
/* ---- calendrier ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid.with-week{grid-template-columns:repeat(7,1fr) 48px}
.cal-cell{border-radius:10px;min-height:56px;padding:6px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .1s}
.cal-cell:active{transform:scale(.97)}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted2);text-align:center;padding:2px 0}
.cal-num{font-size:12px;font-weight:600}
.cal-amt{font-size:10px;font-weight:700;font-family:var(--mono)}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.year-cell{border-radius:14px;padding:14px 8px;border:1px solid var(--line);min-height:82px;display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center;cursor:pointer;text-align:center}
.wk-row{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
/* ---- barres historique objectifs ---- */
.hbars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px}
.hbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.hbars .bar{width:70%;border-radius:5px 5px 0 0;min-height:3px;transition:height .4s}
.hbars .bl{font-size:9px;color:var(--muted)}
/* ---- anneau ---- */
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
/* ---- timeframe / stratégie ---- */
.tf{font-size:10px;font-weight:700;color:var(--blue);padding:3px 8px;border-radius:999px;background:var(--blueSoft)}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="auth-wrap">
  <div style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5b9df8"/><stop offset="1" stop-color="#2e6fe0"/></linearGradient></defs><path d="M3 17l5-5 4 3 8-9"/><path d="M17 3h4v4"/></svg>
      </div>
      <h1 style="margin:0;font-size:24px">Trading Journal</h1>
      <p class="muted" id="authSub" style="margin:4px 0 0">Bon retour</p>
    </div>
    <div class="field"><input id="authEmail" type="email" placeholder="E-mail" autocomplete="email"></div>
    <div class="field"><input id="authPass" type="password" placeholder="Mot de passe" autocomplete="current-password"></div>
    <div id="authErr" class="loss" style="font-size:13px;text-align:center;min-height:18px;margin-bottom:8px"></div>
    <button id="authBtn" class="btn btn-primary" style="width:100%;height:50px">Se connecter</button>
    <button id="authToggle" class="blue" style="width:100%;margin-top:14px;font-weight:600">Créer un compte</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <!-- sidebar (desktop) -->
    <aside class="side">
      <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-9"/><path d="M17 3h4v4"/></svg></span> Trading Journal</div>
      <button class="navitem" data-view="analytics" data-ic="chart"><span>Analytics</span></button>
      <button class="navitem" data-view="history" data-ic="clock"><span>Historique</span></button>
      <button class="navitem" data-view="calendar" data-ic="cal"><span>Calendrier</span></button>
      <button class="navitem" data-view="strategies" data-ic="layers"><span>Stratégies</span></button>
      <button class="navitem" data-view="objectives" data-ic="target"><span>Objectifs</span></button>
      <button class="navitem" data-view="friends" data-ic="users"><span>Amis</span></button>
      <button class="navitem addbtn btn-primary" id="newTradeSide" style="color:#fff;justify-content:center">+ Nouveau trade</button>
      <div class="spacer"></div>
      <button class="navitem" data-view="settings" data-ic="gear"><span>Réglages</span></button>
      <div class="sync" id="syncSide" style="padding:8px 12px"><span class="dot"></span><span>Synchronisé</span></div>
    </aside>

    <!-- main content -->
    <main class="main">
      <div id="view-analytics" class="view"></div>
      <div id="view-history" class="view hidden"></div>
      <div id="view-calendar" class="view hidden"></div>
      <div id="view-strategies" class="view hidden"></div>
      <div id="view-objectives" class="view hidden"></div>
      <div id="view-friends" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
    </main>
  </div>

  <!-- bottom bar (mobile) -->
  <nav class="bottombar">
    <button class="navitem" data-view="analytics" data-ic="chart"><span>Analytics</span></button>
    <button class="navitem" data-view="history" data-ic="clock"><span>Histo.</span></button>
    <button class="add" id="newTradeFab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="navitem" data-view="calendar" data-ic="cal"><span>Calendrier</span></button>
    <button class="navitem" data-view="friends" data-ic="users"><span>Amis</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://jycgmgavrernxgrmczya.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y2dtZ2F2cmVybnhncm1jenlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTcyMTksImV4cCI6MjA5NzQzMzIxOX0.GNvm0KIXdRKYnXNTWJt7WggoFDA2TMtbVlSK-YtrPis";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- state ---------- */
const S = { user:null, trades:[], capital:0, goals:{}, profile:null, strategies:[],
            friendships:[], profilesById:{}, leaderboard:[], incoming:[], outgoing:new Set(),
            econ:[], view:'analytics', filter:{result:'all',side:'all',session:null,q:''},
            lb:{period:'week',metric:'gainPct'}, econF:{impact:'all',cur:new Set()},
            cal:{period:'month', anchor:new Date().toISOString().slice(0,10), strat:new Set()},
            suivi:'week' };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const eur = v => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(v||0);
const eurS = v => (v>0?'+':'')+eur(v);
const numf = v => (v==null||v===''||isNaN(v))?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});
const pct = v => Math.round(v*100)+' %';
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v===null||v===undefined||v==='')?null:Number(v);
const pnlCls = v => v>0?'win':v<0?'loss':'muted';
function navIc(k){const I={chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 5.5a3.5 3.5 0 010 7M22 20a6 6 0 00-5-5.9"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1L14.5 2h-5l-.3 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.4L3 11a7 7 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.3 2.5h5l.3-2.5a7 7 0 001.7-1l2.4 1 2-3.4-2-1.6a7 7 0 00.1-1z"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function setSync(k){document.querySelectorAll('.sync').forEach(e=>{e.className='sync'+(k==='busy'?' busy':k==='off'?' off':'');e.querySelector('span:last-child').textContent=k==='busy'?'Synchro…':k==='off'?'Hors ligne':'Synchronisé';});}
function plannedRR(e,sl,tp){if([e,sl,tp].some(v=>v==null||isNaN(v)))return null;const risk=Math.abs(e-sl),rew=Math.abs(tp-e);return risk<=0?null:rew/risk;}

/* period helpers */
function weekStart(){const d=new Date();const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return d.toISOString().slice(0,10);}
function monthPrefix(){return new Date().toISOString().slice(0,7);}
function inPeriod(t,p){const dt=t.date||'';if(p==='week')return dt>=weekStart();if(p==='month')return dt.startsWith(monthPrefix());return true;}

/* ---------- metrics ---------- */
function stats(trades, cap){
  let pnl=0,w=0,l=0,be=0,gw=0,gl=0,best=0,worst=0;
  trades.forEach(t=>{const p=Number(t.pnl)||0;pnl+=p;if(p>0){w++;gw+=p}else if(p<0){l++;gl+=Math.abs(p)}else be++;best=Math.max(best,p);worst=Math.min(worst,p)});
  const n=trades.length, dec=w+l;
  return {n,w,l,be,pnl,cap:cap+pnl,winRate:dec?w/dec:0,pf:gl>0?gw/gl:null,
    avgWin:w?gw/w:0,avgLoss:l?gl/l:0,best,worst,exp:n?pnl/n:0,
    wlr:gl>0&&l>0&&w>0?(gw/w)/(gl/l):null};
}
function equity(trades,cap){let c=cap;const pts=[{i:0,c,date:null}];trades.forEach((t,i)=>{c+=Number(t.pnl)||0;pts.push({i:i+1,c,date:t.date})});return pts;}
function maxDD(pts){let peak=pts[0]?.c||0,dd=0;pts.forEach(p=>{peak=Math.max(peak,p.c);dd=Math.max(dd,peak-p.c)});return dd;}
function streak(trades){let s=0;for(let i=trades.length-1;i>=0;i--){const p=Number(trades[i].pnl)||0;if(p===0)break;const win=p>0;if(s===0)s=win?1:-1;else if((s>0)===win)s+=win?1:-1;else break;}return s;}
function sessionBreak(trades){const order=['Asie','Londres','New York','Overlap','—'];const m={};trades.forEach(t=>{const k=t.session||'—';(m[k]=m[k]||{pnl:0,n:0,w:0});m[k].pnl+=Number(t.pnl)||0;m[k].n++;if((Number(t.pnl)||0)>0)m[k].w++;});return Object.keys(m).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0))).map(k=>({name:k,...m[k]}));}

/* ---------- data layer ---------- */
async function loadData(){
  setSync('busy');
  const {data:trades,error}=await sb.from('trades').select('*').eq('user_id',S.user.id).order('date',{ascending:true}).order('created_at',{ascending:true});
  if(error){setSync('off');console.error(error);return;}
  S.trades=(trades||[]);
  let {data:st}=await sb.from('settings').select('*').eq('user_id',S.user.id).maybeSingle();
  if(!st){await sb.from('settings').insert({user_id:S.user.id,capital_initial:0});S.capital=0;}
  else S.capital=Number(st.capital_initial)||0;
  const {data:g}=await sb.from('user_goals').select('*').eq('user_id',S.user.id).maybeSingle();
  S.goals=g?{weeklyPnl:num(g.weekly_pnl),targetCapital:num(g.target_capital),monthlyPnl:num(g.monthly_pnl),winRate:num(g.win_rate),monthlyTrades:num(g.monthly_trades)}:{};
  try{const {data:strat}=await sb.from('strategies').select('*').order('created_at',{ascending:true});S.strategies=strat||[];}catch(e){S.strategies=[];}
  setSync('ok');
  render();
  loadSocial();
}
async function tradeRow(t){return {date:t.date||null,side:t.side,session:t.session,instrument:t.instrument,entry:t.entry,sl:t.sl,tp:t.tp,exit:t.exit,lot:t.lot,pnl:t.pnl,note:t.note,strategy_id:t.strategy_id??null};}
/* strategies CRUD */
async function saveStrategy(d,id){setSync('busy');
  if(id){const {data,error}=await sb.from('strategies').update(d).eq('id',id).select().single();if(error){setSync('off');toast('Erreur');return;}S.strategies=S.strategies.map(x=>x.id===id?data:x);}
  else{const {data,error}=await sb.from('strategies').insert(d).select().single();if(error){setSync('off');toast('Erreur : '+error.message);return;}S.strategies.push(data);}
  setSync('ok');render();toast(id?'Stratégie modifiée':'Stratégie créée');}
async function deleteStrategy(id){setSync('busy');const {error}=await sb.from('strategies').delete().eq('id',id);if(error){setSync('off');return;}S.strategies=S.strategies.filter(x=>x.id!==id);S.trades.forEach(t=>{if(t.strategy_id===id)t.strategy_id=null;});setSync('ok');render();toast('Stratégie supprimée');}
async function saveTrade(t,id){
  setSync('busy');const row=await tradeRow(t);
  if(id){const {data,error}=await sb.from('trades').update(row).eq('id',id).select().single();if(error){setSync('off');toast('Erreur');return;}S.trades=S.trades.map(x=>x.id===id?data:x);}
  else{const {data,error}=await sb.from('trades').insert(row).select().single();if(error){setSync('off');toast('Erreur : '+error.message);return;}S.trades.push(data);S.trades.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created_at||'').localeCompare(b.created_at||''));}
  setSync('ok');render();toast(id?'Trade modifié':'Trade ajouté');
}
async function deleteTrade(id){setSync('busy');const {error}=await sb.from('trades').delete().eq('id',id);if(error){setSync('off');return;}S.trades=S.trades.filter(x=>x.id!==id);setSync('ok');render();toast('Trade supprimé');}
async function saveCapital(v){S.capital=v;setSync('busy');await sb.from('settings').upsert({user_id:S.user.id,capital_initial:v});setSync('ok');render();}
async function saveGoals(g){S.goals=g;setSync('busy');await sb.from('user_goals').upsert({user_id:S.user.id,weekly_pnl:g.weeklyPnl,target_capital:g.targetCapital,monthly_pnl:g.monthlyPnl,win_rate:g.winRate,monthly_trades:g.monthlyTrades});setSync('ok');render();toast('Objectifs enregistrés');}

/* social */
async function loadSocial(){
  const {data:me}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=me||null;
  if(!me){render();return;}
  const {data:fs}=await sb.from('friendships').select('*');
  S.friendships=fs||[];
  const acc=[],inc=[],out=new Set();
  (fs||[]).forEach(f=>{if(f.status==='accepted')acc.push(f.requester_id===S.user.id?f.addressee_id:f.requester_id);else if(f.addressee_id===S.user.id)inc.push(f);else if(f.requester_id===S.user.id)out.add(f.addressee_id);});
  S.outgoing=out;
  const need=new Set([...acc,S.user.id]);inc.forEach(f=>need.add(f.requester_id));
  const ids=[...need];
  const {data:profs}=ids.length?await sb.from('profiles').select('*').in('id',ids):{data:[]};
  S.profilesById={};(profs||[]).forEach(p=>S.profilesById[p.id]=p);
  const {data:tr}=await sb.rpc('social_trades');
  const {data:se}=await sb.rpc('social_settings');
  const byUser={};(tr||[]).forEach(t=>{(byUser[t.user_id]=byUser[t.user_id]||[]).push(t)});
  const capBy={};(se||[]).forEach(s=>capBy[s.user_id]=Number(s.capital_initial)||0);
  S.leaderboard=[S.user.id,...acc].filter(id=>S.profilesById[id]).map(id=>({profile:S.profilesById[id],trades:byUser[id]||[],cap:capBy[id]||0,isMe:id===S.user.id}));
  S.incoming=inc.map(f=>({f,profile:S.profilesById[f.requester_id]})).filter(x=>x.profile);
  render();
}
function lbMetric(e,m,p){const t=e.trades.filter(x=>inPeriod(x,p));const s=stats(t,e.cap);if(m==='gainPct')return e.cap>0?s.pnl/e.cap*100:0;if(m==='winRate')return s.winRate*100;return s.pnl;}
function lbLabel(e,m,p){const v=lbMetric(e,m,p);if(m==='gainPct')return (v>0?'+':'')+v.toFixed(1)+' %';if(m==='winRate')return Math.round(v)+' %';return eurS(v);}

function equitySVG(pts){
  if(pts.length<2)return `<div class="muted" style="height:190px;display:flex;align-items:center;justify-content:center">Ajoute un trade pour voir la courbe</div>`;
  const W=600,H=190,pad=6;const xs=pts.map(p=>p.c);const mn=Math.min(...xs),mx=Math.max(...xs),rg=mx-mn||1;
  const X=i=>pad+i/(pts.length-1)*(W-2*pad);const Y=c=>H-pad-(c-mn)/rg*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.c).toFixed(1)}`).join(' ');
  const area=line+` L${X(pts.length-1)},${H} L${X(0)},${H} Z`;
  return `<svg class="equity" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#eg)"/><path d="${line}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle r="3.5" fill="#3b82f6" cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1].c)}"/></svg><div class="eq-guide" id="eqGuide"></div><div class="eq-dot" id="eqDot"></div><div class="eq-tip" id="eqTip"></div>`;
}
function hookEquity(){
  const wrap=$('#eqWrap'),svg=wrap?.querySelector('svg');if(!svg)return;
  const pts=equity(S.trades,S.capital);if(pts.length<2)return;
  const tip=$('#eqTip'),dot=$('#eqDot'),guide=$('#eqGuide');
  const W=600,H=190,pad=6;const xs=pts.map(p=>p.c),mn=Math.min(...xs),mx=Math.max(...xs),rg=mx-mn||1;
  const move=e=>{const r=svg.getBoundingClientRect();let rel=(e.clientX-r.left)/r.width;rel=Math.max(0,Math.min(1,rel));
    const i=Math.round(rel*(pts.length-1));const p=pts[i];
    const vx=pad+i/(pts.length-1)*(W-2*pad), vy=H-pad-(p.c-mn)/rg*(H-2*pad);
    const xPx=vx/W*r.width, yPx=vy/H*r.height;
    dot.style.left=xPx+'px';dot.style.top=yPx+'px';dot.style.opacity=1;
    guide.style.left=xPx+'px';guide.style.opacity=1;
    tip.textContent=(p.date?p.date+' · ':'')+eur(p.c);tip.style.left=xPx+'px';tip.style.top=yPx+'px';tip.style.opacity=1;
    $('#eqVal').textContent=eur(p.c);};
  const hide=()=>{tip.style.opacity=0;dot.style.opacity=0;guide.style.opacity=0;$('#eqVal').textContent='';};
  wrap.onpointermove=move;wrap.onpointerdown=move;wrap.onpointerleave=hide;
}
function pnlBars(trades){const mx=Math.max(1,...trades.map(t=>Math.abs(Number(t.pnl)||0)));return trades.map(t=>{const p=Number(t.pnl)||0;return `<div title="${eurS(p)}" style="height:${Math.max(2,Math.abs(p)/mx*100)}%;background:${p>=0?'var(--win)':'var(--loss)'}"></div>`;}).join('');}

/* ---- history ---- */
function renderHistory(){
  const f=S.filter;const active=f.result!=='all'||f.side!=='all'||f.session||f.q;
  let items=[...S.trades].reverse().filter(t=>{const p=Number(t.pnl)||0;
    if(f.result==='win'&&!(p>0))return false;if(f.result==='loss'&&!(p<0))return false;if(f.result==='be'&&p!==0)return false;
    if(f.side!=='all'&&t.side!==f.side)return false;if(f.session&&t.session!==f.session)return false;
    if(f.q&&!((t.instrument||'')+' '+(t.note||'')).toLowerCase().includes(f.q.toLowerCase()))return false;return true;});
  $('#view-history').innerHTML=`

function tradeRowHTML(t){const side=t.side&&t.side!=='na'?`<span class="pill" style="background:${t.side==='buy'?'rgba(63,184,96,.14)':'rgba(229,72,77,.14)'};color:${t.side==='buy'?'var(--win)':'var(--loss)'};font-size:10px">${t.side.toUpperCase()}</span>`:'';

    <div class="spacer"></div><span class="mono ${pnlCls(Number(t.pnl))}" style="font-weight:600">${eurS(Number(t.pnl)||0)}</span></button>`;

/* ---- objectives ---- */
function goalItems(){const out=[];const s=stats(S.trades,S.capital);const mt=S.trades.filter(t=>inPeriod(t,'month'));const mp=mt.reduce((a,t)=>a+(Number(t.pnl)||0),0);const wp=S.trades.filter(t=>inPeriod(t,'week')).reduce((a,t)=>a+(Number(t.pnl)||0),0);
  const g=S.goals;const add=(t,cur,tar,fmt)=>{if(tar!=null)out.push({t,cur,tar,r:Math.min(1,Math.max(0,tar>0?cur/tar:0)),fmt});};
  add('Objectif de la semaine',wp,g.weeklyPnl,eurS);add('Objectif de capital',s.cap,g.targetCapital,eur);add('Gain ce mois-ci',mp,g.monthlyPnl,eurS);add('Win rate visé',s.winRate*100,g.winRate,v=>Math.round(v)+' %');add('Trades ce mois',mt.length,g.monthlyTrades,v=>Math.round(v));return out;}
function renderObjectives(){
  const items=goalItems();const reached=items.filter(i=>i.r>=1).length;
  const hasW=S.goals.weeklyPnl!=null,hasM=S.goals.monthlyPnl!=null;
  const period=((S.suivi==='month')&&hasM)||(!hasW&&hasM)?'month':'week';
  let suivi='';
  if(hasW||hasM){
    const target=period==='week'?S.goals.weeklyPnl:S.goals.monthlyPnl;
    const data=goalHistory(period,target,period==='week'?8:6);
    const maxV=Math.max(1,...data.map(d=>Math.abs(d.pnl)),Math.abs(target||0));
    const hit=data.filter(d=>target>0&&d.pnl>=target).length;
    const tline=target>0?`<div style="position:absolute;left:0;right:0;bottom:${Math.min(100,Math.max(0,target/maxV*100)).toFixed(1)}%;border-top:1px dashed var(--muted2);pointer-events:none"></div>`:'';
    suivi=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px"><span class="label">Suivi</span><div class="spacer"></div>${(hasW&&hasM)?`<div class="seg">${[['week','Semaine'],['month','Mois']].map(([k,l])=>`<button class="${period===k?'on':''}" data-suivi="${k}">${l}</button>`).join('')}</div>`:''}</div>
      <div style="position:relative">${tline}<div class="hbars">${data.map(d=>{const h=Math.max(3,Math.abs(d.pnl)/maxV*100);const col=target>0&&d.pnl>=target?'var(--win)':d.pnl>=0?'var(--blue)':'var(--loss)';return `<div class="b"><div class="bar" style="height:${h}%;background:${col}"></div><div class="bl">${esc(d.label)}</div></div>`;}).join('')}</div></div>
      <div class="row" style="margin-top:10px"><span class="muted" style="font-size:12px">${hit} / ${data.length} ${period==='week'?'semaines':'mois'} atteint${hit>1?'s':''}</span><div class="spacer"></div><span class="blue" style="font-size:12px;font-weight:600">Cible ${eurS(target||0)}</span></div></div>`;
  }
  $('#view-objectives').innerHTML=`<h1 class="page" style="margin-bottom:16px">Objectifs</h1>
    ${items.length?`<div class="card row" style="margin-bottom:12px"><div style="position:relative;width:60px;height:60px;flex:none">${ringSVG(reached/items.length,60,reached===items.length)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">${reached}/${items.length}</div></div><div><div class="label">Objectifs atteints</div><b style="font-weight:700;font-size:17px">${reached===items.length?'Tout est atteint 🎉':reached+' sur '+items.length}</b><div class="muted" style="font-size:12px">Sur la période en cours</div></div></div>`:''}
    ${items.length?items.map(it=>`<div class="card" style="margin-bottom:12px"><div class="row" style="gap:14px;align-items:flex-start"><div style="position:relative;width:52px;height:52px;flex:none">${ringSVG(it.r,52,it.r>=1)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${it.r>=1?'✓':Math.round(it.r*100)+'%'}</div></div>
      <div style="flex:1;min-width:0"><div class="row"><span class="${it.r>=1?'win':'blue'}">${navIc('target')}</span><b style="font-weight:600">${it.t}</b><div class="spacer"></div>${it.r>=1?'<span class="pill win" style="background:rgba(63,184,96,.14);font-size:10px">Atteint</span>':''}</div>
      <div class="mono ${it.r>=1?'win':''}" style="font-weight:700;margin:6px 0">${it.fmt(it.cur)} / ${it.fmt(it.tar)}</div>
      <div class="progress"><i style="width:${it.r*100}%;background:${it.r>=1?'var(--win)':'var(--blue)'}"></i></div></div></div></div>`).join('')
    :`<div class="card" style="text-align:center;padding:40px 20px"><div class="blue" style="margin-bottom:8px">${navIc('target')}</div><b>Aucun objectif</b><div class="muted" style="font-size:13px;margin:6px 0 16px">Fixe-toi des objectifs pour suivre ta progression.</div></div>`}
    ${suivi}
    <button class="btn btn-ghost" id="editGoals" style="width:100%;margin-top:4px">${items.length?'Modifier mes objectifs':'Définir mes objectifs'}</button>`;
}

  const curs=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
  $('#view-econ').innerHTML=`

      groups.length?groups.map(g=>`<div class="label" style="margin:14px 0 6px">${econDayLabel(g.k)}</div>${g.items.map(e=>econRow(e)).join('')}`).join(''):

function impactLevel(e){return {high:3,medium:2,low:1}[(e.impact||'').toLowerCase()]||0;}
function impactColor(e){return [, 'var(--muted2)','#e0c84a','#e6a23c','var(--loss)'][impactLevel(e)+1]||'var(--muted2)';}
function econDayLabel(k){if(!k)return '';const d=new Date(k+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((d-t)/864e5);if(diff===0)return "AUJOURD'HUI";if(diff===1)return 'DEMAIN';if(diff===-1)return 'HIER';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}).toUpperCase();}
function econRow(e){const time=e.date?new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
  return `<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 14px">
    <span style="width:9px;height:9px;border-radius:50%;background:${impactColor(e)};flex:none"></span>
    <span class="mono muted" style="width:46px;font-size:13px">${time}</span>
    <span class="pill" style="background:var(--surface2);font-size:11px">${esc(e.country)}</span>
    <div style="min-width:0"><div style="font-size:14px">${esc(e.title)}</div>${(e.forecast||e.previous)?`<div class="muted" style="font-size:11px">${e.forecast?'Prév. '+esc(e.forecast):''} ${e.previous?'· Préc. '+esc(e.previous):''}</div>`:''}</div></div>`;
}
async function loadEcon(force){
  if(S.econ.length&&!force)return render();
  S.econLoading=true;S.econErr=null;if(S.view==='econ')render();
  try{
    const fetchWk=async name=>{const u='https://api.allorigins.win/raw?url='+encodeURIComponent('https://nfs.faireconomy.media/'+name);const r=await fetch(u);if(!r.ok)throw 0;return r.json();};
    let all=await fetchWk('ff_calendar_thisweek.json');
    try{all=all.concat(await fetchWk('ff_calendar_nextweek.json'));}catch(e){}
    S.econ=all.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  }catch(e){S.econErr='Impossible de charger le calendrier (réessaie).';}
  S.econLoading=false;render();
}

const TF_PRESET=['1m','5m','15m','30m','1H','4H','1D','1W'];
function strategyModal(id){
  const s=id?S.strategies.find(x=>x.id===id):{name:'',description:'',timeframes:[]};if(!s)return;
  let tfs=new Set(s.timeframes||[]);
  const chipsHTML=()=>{const all=[...TF_PRESET,...[...tfs].filter(x=>!TF_PRESET.includes(x))];return all.map(tf=>`<button type="button" class="chip ${tfs.has(tf)?'on':''}" data-tf="${esc(tf)}">${esc(tf)}</button>`).join('');};
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Annuler</button><div class="spacer"></div><b>${id?'Modifier':'Nouvelle stratégie'}</b><div class="spacer"></div><button class="blue" id="sSave" style="font-weight:600">Enreg.</button></div>
    <div class="field"><span class="label">Nom</span><input id="s_name" value="${esc(s.name||'')}" placeholder="Ex. FVG + OB"></div>
    <div class="field"><span class="label">Description</span><textarea id="s_desc" rows="3" placeholder="Contexte, conditions d'entrée, invalidation…">${esc(s.description||'')}</textarea></div>
    <div class="field"><span class="label">Timeframes</span><div class="row" id="s_tfs" style="gap:6px;flex-wrap:wrap">${chipsHTML()}</div></div>
    <div class="row" style="gap:8px"><input id="s_custom" placeholder="Autre (ex. 2H)" style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--text)"><button class="btn btn-ghost" id="s_add">Ajouter</button></div>
    ${id?`<button class="btn btn-danger" id="s_del" style="width:100%;margin-top:14px">Supprimer la stratégie</button>`:''}`);

  if(id)$('#s_del').onclick=async()=>{if(confirm('Supprimer cette stratégie ? Les trades seront conservés.')){await deleteStrategy(id);closeModal();}};
}

/* ============ CALENDRIER ============ */
function ymd(d){return d.toISOString().slice(0,10);}
function calTrades(){if(!S.cal.strat.size)return S.trades;return S.trades.filter(t=>t.strategy_id&&S.cal.strat.has(t.strategy_id));}
function dailyMap(trades){const m={};trades.forEach(t=>{if(!t.date)return;const k=t.date;(m[k]=m[k]||{pnl:0,n:0,w:0});m[k].pnl+=Number(t.pnl)||0;m[k].n++;if((Number(t.pnl)||0)>0)m[k].w++;});return m;}
function compactEur(v){const a=Math.abs(v);const s=v>0?'+':v<0?'-':'';return a>=1000?s+(a/1000).toFixed(1)+'k':s+Math.round(a);}
function heat(pnl,maxAbs){if(!pnl)return 'background:var(--surface2)';const int=(0.14+0.34*Math.min(1,Math.abs(pnl)/(maxAbs||1))).toFixed(2);const c=pnl>=0?'63,184,96':'229,72,77';return `background:rgba(${c},${int});border-color:rgba(${c},.3)`;}
function weekDays(anchor){const d=new Date(anchor);const off=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-off);const out=[];for(let i=0;i<7;i++){const x=new Date(d);x.setUTCDate(d.getUTCDate()+i);out.push(x);}return out;}
function monthWeeks(anchor){const y=anchor.getUTCFullYear(),m=anchor.getUTCMonth();const first=new Date(Date.UTC(y,m,1));const lead=(first.getUTCDay()+6)%7;const days=new Date(Date.UTC(y,m+1,0)).getUTCDate();const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(new Date(Date.UTC(y,m,d)));while(cells.length%7)cells.push(null);const w=[];for(let i=0;i<cells.length;i+=7)w.push(cells.slice(i,i+7));return w;}
function periodPnl(map,anchor,period){
  if(period==='day')return (map[ymd(anchor)]?.pnl)||0;
  if(period==='week')return weekDays(anchor).reduce((a,d)=>a+((map[ymd(d)]?.pnl)||0),0);
  if(period==='month'){const p=anchor.toISOString().slice(0,7);return Object.keys(map).filter(k=>k.startsWith(p)).reduce((a,k)=>a+map[k].pnl,0);}
  const yr=anchor.getUTCFullYear()+'-';return Object.keys(map).filter(k=>k.startsWith(yr)).reduce((a,k)=>a+map[k].pnl,0);
}
function renderCalendar(){
  const c=S.cal;const anchor=new Date(c.anchor+'T00:00:00Z');const map=dailyMap(calTrades());
  const opt={timeZone:'UTC'};
  const title=c.period==='day'?anchor.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',...opt})
    :c.period==='week'?(()=>{const d=weekDays(anchor);return d[0].toLocaleDateString('fr-FR',{day:'numeric',month:'short',...opt})+' – '+d[6].toLocaleDateString('fr-FR',{day:'numeric',month:'short',...opt});})()
    :c.period==='month'?anchor.toLocaleDateString('fr-FR',{month:'long',year:'numeric',...opt}):String(anchor.getUTCFullYear());
  const total=periodPnl(map,anchor,c.period);
  const chips=S.strategies.length?`<div class="row" style="gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px"><button class="chip ${c.strat.size===0?'on':''}" data-strat="">Global</button>${S.strategies.map(s=>`<button class="chip ${c.strat.has(s.id)?'on':''}" data-strat="${s.id}">${esc(s.name)}</button>`).join('')}</div>`:'';
  const body=c.period==='month'?monthHTML(anchor,map):c.period==='week'?weekHTML(anchor,map):c.period==='year'?yearHTML(anchor,map):dayListHTML(ymd(anchor));
  $('#view-calendar').innerHTML=`<h1 class="page" style="margin-bottom:14px">Calendrier</h1>
    <div class="seg" style="margin-bottom:12px">${[['day','Jour'],['week','Semaine'],['month','Mois'],['year','Année']].map(([k,l])=>`<button class="${c.period===k?'on':''}" data-calp="${k}">${l}</button>`).join('')}</div>
    ${chips}
    <div class="row" style="margin-bottom:14px"><button class="btn btn-ghost" data-calnav="-1" style="padding:8px 13px">‹</button><div class="spacer"></div><div style="text-align:center"><div style="font-weight:700;text-transform:capitalize">${esc(String(title))}</div><div class="mono ${pnlCls(total)}" style="font-size:14px">${eurS(total)}</div></div><div class="spacer"></div><button class="btn btn-ghost" data-calnav="1" style="padding:8px 13px">›</button></div>
    ${body}`;
}
function monthHTML(anchor,map){
  const weeks=monthWeeks(anchor);const p=anchor.toISOString().slice(0,7);
  const maxAbs=Math.max(1,...Object.keys(map).filter(k=>k.startsWith(p)).map(k=>Math.abs(map[k].pnl)));
  const today=ymd(new Date());const dows=['L','M','M','J','V','S','D'];
  let html='<div class="cal-grid with-week" style="margin-bottom:6px">'+dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')+'<div class="cal-dow">Sem.</div></div>';
  weeks.forEach(wk=>{html+='<div class="cal-grid with-week" style="margin-bottom:6px">';
    wk.forEach(d=>{if(!d){html+='<div></div>';return;}const k=ymd(d);const day=map[k];const isT=k===today;
      html+=`<div class="cal-cell" data-calday="${k}" style="${heat(day?.pnl||0,maxAbs)};${isT?'border-color:var(--blue);border-width:1.5px':''}"><div class="cal-num" style="${day?'':'color:var(--muted2)'}">${d.getUTCDate()}</div>${day?`<div class="cal-amt ${pnlCls(day.pnl)}">${compactEur(day.pnl)}</div>`:''}</div>`;});
    const wp=wk.filter(Boolean).reduce((a,d)=>a+((map[ymd(d)]?.pnl)||0),0);const wn=wk.filter(Boolean).reduce((a,d)=>a+((map[ymd(d)]?.n)||0),0);
    html+=`<div class="cal-cell" style="background:var(--surface);cursor:default;align-items:center;justify-content:center;text-align:center">${wn?`<div class="cal-amt ${pnlCls(wp)}">${compactEur(wp)}</div><div class="label">${wn}t</div>`:'<span class="muted">–</span>'}</div></div>`;});
  return html;
}
function weekHTML(anchor,map){
  const days=weekDays(anchor);const maxAbs=Math.max(1,...days.map(d=>Math.abs((map[ymd(d)]?.pnl)||0)));const today=ymd(new Date());
  return days.map(d=>{const k=ymd(d);const day=map[k];return `<button class="wk-row" data-calday="${k}" style="${heat(day?.pnl||0,maxAbs)};${k===today?'border-color:var(--blue)':''}"><div><b style="text-transform:capitalize">${d.toLocaleDateString('fr-FR',{weekday:'long',timeZone:'UTC'})}</b><div class="muted" style="font-size:12px">${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',timeZone:'UTC'})}</div></div><div class="spacer"></div>${day?`<div style="text-align:right"><div class="mono ${pnlCls(day.pnl)}" style="font-weight:700">${eurS(day.pnl)}</div><div class="muted" style="font-size:11px">${day.n} trade${day.n>1?'s':''} · ${day.w}✓</div></div>`:'<span class="muted">—</span>'}</button>`;}).join('');
}
function yearHTML(anchor,map){
  const y=anchor.getUTCFullYear();const months=[];for(let m=0;m<12;m++){const p=y+'-'+String(m+1).padStart(2,'0');const keys=Object.keys(map).filter(k=>k.startsWith(p));months.push({m,pnl:keys.reduce((a,k)=>a+map[k].pnl,0),n:keys.reduce((a,k)=>a+map[k].n,0)});}
  const maxAbs=Math.max(1,...months.map(x=>Math.abs(x.pnl)));const now=new Date();
  return '<div class="year-grid">'+months.map(x=>{const name=new Date(Date.UTC(y,x.m,1)).toLocaleDateString('fr-FR',{month:'short',timeZone:'UTC'});const cur=x.m===now.getUTCMonth()&&y===now.getUTCFullYear();return `<div class="year-cell" data-calmon="${x.m}" style="${heat(x.pnl,maxAbs)};${cur?'border-color:var(--blue)':''}"><div style="font-weight:600;text-transform:capitalize">${name}</div>${x.n?`<div class="mono ${pnlCls(x.pnl)}" style="font-weight:700">${compactEur(x.pnl)}</div><div class="label">${x.n} trades</div>`:'<span class="muted">—</span>'}</div>`;}).join('')+'</div>';
}
function dayListHTML(k){
  const trades=calTrades().filter(t=>t.date===k);const total=trades.reduce((a,t)=>a+(Number(t.pnl)||0),0);const w=trades.filter(t=>(Number(t.pnl)||0)>0).length;
  return `<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="label">Résultat du jour</div><div class="mono ${pnlCls(total)}" style="font-size:24px;font-weight:700">${eurS(total)}</div></div><div class="spacer"></div><div style="text-align:right"><div class="muted">${trades.length} trades</div><div class="win">${w} gagnants</div></div></div></div>
    ${trades.length?trades.map(t=>tradeRowHTML(t)).join(''):`<div class="muted" style="text-align:center;padding:30px">Aucun trade ce jour-là</div>`}`;
}
function dayModal(k){modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Fermer</button><div class="spacer"></div><b>${esc(new Date(k+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',timeZone:'UTC'}))}</b><div class="spacer"></div><span></span></div>${dayListHTML(k)}`);}
function calNav(dir){const c=S.cal;const d=new Date(c.anchor+'T00:00:00Z');if(c.period==='day')d.setUTCDate(d.getUTCDate()+dir);else if(c.period==='week')d.setUTCDate(d.getUTCDate()+7*dir);else if(c.period==='month')d.setUTCMonth(d.getUTCMonth()+dir);else d.setUTCFullYear(d.getUTCFullYear()+dir);c.anchor=ymd(d);render();}

/* ============ HISTORIQUE OBJECTIFS ============ */
function isoWeek(d){const dt=new Date(d);dt.setUTCHours(0,0,0,0);dt.setUTCDate(dt.getUTCDate()+3-((dt.getUTCDay()+6)%7));const w1=new Date(Date.UTC(dt.getUTCFullYear(),0,4));return 1+Math.round(((dt-w1)/864e5-3+((w1.getUTCDay()+6)%7))/7);}
function goalHistory(period,target,count){const map=dailyMap(S.trades);const out=[];const now=new Date();
  if(period==='week'){const base=new Date(now);const off=(base.getUTCDay()+6)%7;base.setUTCDate(base.getUTCDate()-off);base.setUTCHours(0,0,0,0);
    for(let i=count-1;i>=0;i--){const s=new Date(base);s.setUTCDate(base.getUTCDate()-i*7);const e=new Date(s);e.setUTCDate(s.getUTCDate()+7);let pnl=0;Object.keys(map).forEach(k=>{const dt=new Date(k+'T00:00:00Z');if(dt>=s&&dt<e)pnl+=map[k].pnl;});out.push({label:'S.'+isoWeek(s),pnl,target});}}
  else{for(let i=count-1;i>=0;i--){const s=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1));const p=s.toISOString().slice(0,7);let pnl=0;Object.keys(map).forEach(k=>{if(k.startsWith(p))pnl+=map[k].pnl;});out.push({label:s.toLocaleDateString('fr-FR',{month:'short',timeZone:'UTC'}),pnl,target});}}
  return out;}
function ringSVG(r,size,win){const R=(size-6)/2;const C=2*Math.PI*R;const off=C*(1-Math.min(1,Math.max(0,r)));const col=win?'#3fb860':'#3b82f6';return `<svg width="${size}" height="${size}" class="ring"><circle cx="${size/2}" cy="${size/2}" r="${R}" stroke="var(--surface2)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${R}" stroke="${col}" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>`;}

/* ============ EXPORT / IMPORT ============ */
function stratName(id){const s=S.strategies.find(x=>x.id===id);return s?s.name:null;}
function dlToday(){return new Date().toISOString().slice(0,10);}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportJSON(){
  const data={app:'TradingJournal',version:1,exportedAt:new Date().toISOString(),capitalInitial:S.capital,goals:S.goals,
    strategies:S.strategies.map(s=>({name:s.name,description:s.description||null,timeframes:s.timeframes||[]})),
    trades:S.trades.map(t=>({date:t.date,side:t.side,session:t.session,instrument:t.instrument,entry:t.entry,sl:t.sl,tp:t.tp,exit:t.exit,lot:t.lot,pnl:t.pnl,note:t.note,strategy:stratName(t.strategy_id)}))};
  download('trading-journal-'+dlToday()+'.json',JSON.stringify(data,null,2),'application/json');toast('Export JSON prêt');
}
function csvEsc(v){if(v==null)return '';v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  const cols=['date','side','session','instrument','entry','sl','tp','exit','lot','pnl','strategy','note'];
  const rows=[cols.join(',')];
  S.trades.forEach(t=>rows.push(cols.map(c=>csvEsc(c==='strategy'?stratName(t.strategy_id):t[c])).join(',')));
  download('trading-journal-'+dlToday()+'.csv',rows.join('\n'),'text/csv');toast('Export CSV prêt');
}
const numL=v=>{if(v==null||v==='')return null;const n=Number(String(v).replace(',','.').replace(/\s/g,''));return isNaN(n)?null:n;};
async function ensureStrategy(name,cache){if(!name)return null;const key=String(name).trim().toLowerCase();if(!key)return null;if(cache[key]!==undefined)return cache[key];
  const ex=S.strategies.find(s=>(s.name||'').trim().toLowerCase()===key);if(ex){cache[key]=ex.id;return ex.id;}
  const {data,error}=await sb.from('strategies').insert({name:String(name).trim(),description:null,timeframes:[]}).select().single();
  if(error||!data){cache[key]=null;return null;}S.strategies.push(data);cache[key]=data.id;return data.id;}
async function importJSON(text){let d;try{d=JSON.parse(text);}catch(e){toast('JSON invalide');return;}
  setSync('busy');const cache={};let n=0;
  try{
    if(Array.isArray(d.strategies)){for(const s of d.strategies){if(!s||!s.name)continue;const key=s.name.trim().toLowerCase();if(S.strategies.some(x=>(x.name||'').trim().toLowerCase()===key)){cache[key]=S.strategies.find(x=>(x.name||'').trim().toLowerCase()===key).id;continue;}const {data}=await sb.from('strategies').insert({name:s.name.trim(),description:s.description||null,timeframes:s.timeframes||[]}).select().single();if(data){S.strategies.push(data);cache[key]=data.id;}}}
    const trades=Array.isArray(d.trades)?d.trades:[];const out=[];
    for(const t of trades){const sid=await ensureStrategy(t.strategy||t.strategy_name,cache);out.push({date:t.date||null,side:t.side||null,session:t.session||null,instrument:t.instrument||null,entry:numL(t.entry),sl:numL(t.sl),tp:numL(t.tp),exit:numL(t.exit),lot:numL(t.lot),pnl:numL(t.pnl),note:t.note||null,strategy_id:sid});}
    if(out.length){const {data,error}=await sb.from('trades').insert(out).select();if(error)throw error;S.trades.push(...(data||[]));n=out.length;}
    if(d.capitalInitial!=null){S.capital=Number(d.capitalInitial)||0;await sb.from('settings').upsert({user_id:S.user.id,capital_initial:S.capital});}
    if(d.goals&&Object.keys(d.goals||{}).length){const g=d.goals;S.goals=g;await sb.from('user_goals').upsert({user_id:S.user.id,weekly_pnl:g.weeklyPnl,target_capital:g.targetCapital,monthly_pnl:g.monthlyPnl,win_rate:g.winRate,monthly_trades:g.monthlyTrades});}
    S.trades.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created_at||'').localeCompare(b.created_at||''));
    setSync('ok');render();toast(n+' trades importés');
  }catch(e){setSync('off');toast('Import échoué : '+(e.message||e));}
}
function parseCSV(text){const rows=[];let i=0,field='',row=[],inQ=false;while(i<text.length){const c=text[i];
  if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
  else{if(c==='"')inQ=true;else if(c===','){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}else field+=c;}
  i++;}
  if(field!==''||row.length){row.push(field);rows.push(row);}return rows;}
async function importCSV(text){const rows=parseCSV(text);if(rows.length<2){toast('CSV vide');return;}
  const head=rows[0].map(h=>h.trim().toLowerCase());const idx=n=>head.indexOf(n);const cell=(row,names)=>{for(const n of names){const j=idx(n);if(j>=0)return row[j];}return '';};
  setSync('busy');const cache={};
  try{const out=[];
    for(let r=1;r<rows.length;r++){const row=rows[r];if(!row.length||row.every(x=>x===''))continue;
      const sid=await ensureStrategy(cell(row,['strategy','stratégie','strategie']),cache);
      out.push({date:cell(row,['date'])||null,side:cell(row,['side','sens'])||null,session:cell(row,['session'])||null,instrument:cell(row,['instrument'])||null,entry:numL(cell(row,['entry','entrée','entree'])),sl:numL(cell(row,['sl'])),tp:numL(cell(row,['tp'])),exit:numL(cell(row,['exit','sortie'])),lot:numL(cell(row,['lot'])),pnl:numL(cell(row,['pnl','gain','p&l'])),note:cell(row,['note'])||null,strategy_id:sid});}
    if(out.length){const {data,error}=await sb.from('trades').insert(out).select();if(error)throw error;S.trades.push(...(data||[]));S.trades.sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
    setSync('ok');render();toast(out.length+' trades importés');
  }catch(e){setSync('off');toast('Import échoué : '+(e.message||e));}
}

  const cd=e.target.closest('[data-calday]');if(cd)dayModal(cd.dataset.calday);
  const cmo=e.target.closest('[data-calmon]');if(cmo){const m=+cmo.dataset.calmon;const d=new Date(S.cal.anchor+'T00:00:00Z');S.cal.anchor=ymd(new Date(Date.UTC(d.getUTCFullYear(),m,1)));S.cal.period='month';render();}
  const cst=e.target.closest('[data-strat]');if(cst){const id=cst.dataset.strat;if(!id)S.cal.strat.clear();else S.cal.strat.has(id)?S.cal.strat.delete(id):S.cal.strat.add(id);render();}
  const sv=e.target.closest('[data-suivi]');if(sv){S.suivi=sv.dataset.suivi;render();}
  const th=e.target.closest('[data-theme]');if(th)setTheme(th.dataset.theme);
  const imp=e.target.closest('[data-impact]');if(imp){S.econF.impact=imp.dataset.impact;render();}
  const cur=e.target.closest('[data-cur]');if(cur){const c=cur.dataset.cur;S.econF.cur.has(c)?S.econF.cur.delete(c):S.econF.cur.add(c);render();}
  if(e.target.closest('#econRefresh')||e.target.closest('#econRetry'))loadEcon(true);
  const per=e.target.closest('[data-period]');if(per){S.lb.period=per.dataset.period;render();}
  const met=e.target.closest('[data-metric]');if(met){S.lb.metric=met.dataset.metric;render();}
  if(e.target.closest('#addFriend'))addFriendModal();
  const fr=e.target.closest('[data-friend]');if(fr)friendModal(fr.dataset.friend);
  const ac=e.target.closest('[data-accept]');if(ac)acceptFriend(ac.dataset.accept);
  const dc=e.target.closest('[data-decline]');if(dc)declineFriend(dc.dataset.decline);
  if(e.target.closest('#capSave')){const v=Number($('#capInput').value)||0;saveCapital(v);toast('Capital enregistré');}
  if(e.target.closest('#expJson'))exportJSON();
  if(e.target.closest('#expCsv'))exportCSV();
  if(e.target.closest('#signout'))sb.auth.signOut();
  if(e.target.closest('#cpSave'))createProfile();
});
document.addEventListener('change',e=>{
  if(e.target.id==='avatarInput'&&e.target.files[0])uploadAvatar(e.target.files[0]);
  if(e.target.id==='impJson'&&e.target.files[0]){e.target.files[0].text().then(importJSON);e.target.value='';}
  if(e.target.id==='impCsv'&&e.target.files[0]){e.target.files[0].text().then(importCSV);e.target.value='';}
});
function filterModal(){
  const f=S.filter;
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Réinit.</button><div class="spacer"></div><b>Filtres</b><div class="spacer"></div><button class="blue" onclick="window.__close()" style="font-weight:600">OK</button></div>
    <div class="field"><span class="label">Recherche</span><input id="fq" placeholder="Instrument ou note" value="${esc(f.q)}"></div>
    <div class="field"><span class="label">Résultat</span><select id="fr"><option value="all">Tous</option><option value="win">Gagnants</option><option value="loss">Perdants</option><option value="be">BE</option></select></div>
    <div class="field"><span class="label">Sens</span><select id="fs"><option value="all">Tous</option><option value="buy">BUY</option><option value="sell">SELL</option></select></div>
    <div class="field"><span class="label">Session</span><select id="fses"><option value="">Toutes</option>${['Asie','Londres','New York','Overlap','—'].map(s=>`<option ${f.session===s?'selected':''}>${s}</option>`).join('')}</select></div>`);
  $('#fr').value=f.result;$('#fs').value=f.side;
  const upd=()=>{S.filter={result:$('#fr').value,side:$('#fs').value,session:$('#fses').value||null,q:$('#fq').value};render();};
  ['fq','fr','fs','fses'].forEach(id=>$('#'+id).onchange=upd);$('#fq').oninput=upd;
  $('#mbg').querySelector('.muted').onclick=()=>{S.filter={result:'all',side:'all',session:null,q:''};closeModal();render();};
}
async function acceptFriend(id){await sb.from('friendships').update({status:'accepted'}).eq('id',id);toast('Ami accepté');loadSocial();}
async function declineFriend(id){await sb.from('friendships').delete().eq('id',id);loadSocial();}
async function createProfile(){
  const u=$('#cpUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');const n=$('#cpName').value.trim();const bio=$('#cpBio').value.trim();
  if(u.length<3||u.length>20){$('#cpErr').textContent='Pseudo : 3 à 20 caractères (minuscules, chiffres, _).';return;}
  if(!n){$('#cpErr').textContent='Indique un nom affiché.';return;}
  const {error}=await sb.from('profiles').insert({id:S.user.id,username:u,display_name:n,bio:bio||null});
  if(error){$('#cpErr').textContent=error.message.includes('duplicate')||error.message.includes('unique')?'Ce pseudo est déjà pris.':error.message;return;}
  toast('Profil créé');loadSocial();
}
async function uploadAvatar(file){
  setSync('busy');
  const path=S.user.id.toLowerCase()+'/avatar.jpg';
  const {error}=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});
  if(error){setSync('off');toast('Erreur photo : '+error.message);return;}
  const {data}=sb.storage.from('avatars').getPublicURL(path);
  const url=data.publicUrl+'?t='+Date.now();
  await sb.from('profiles').update({avatar_url:url}).eq('id',S.user.id);
  setSync('ok');toast('Photo mise à jour');loadSocial();
}

/* ============ AUTH ============ */
let signup=false;
$('#authToggle').onclick=()=>{signup=!signup;$('#authBtn').textContent=signup?'Créer le compte':'Se connecter';$('#authSub').textContent=signup?'Crée ton compte':'Bon retour';$('#authToggle').textContent=signup?"J'ai déjà un compte":'Créer un compte';$('#authErr').textContent='';};
$('#authBtn').onclick=async()=>{
  const email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  $('#authErr').textContent='';$('#authBtn').disabled=true;
  const fn=signup?sb.auth.signUp({email,password:pass}):sb.auth.signInWithPassword({email,password:pass});
  const {error}=await fn;$('#authBtn').disabled=false;
  if(error)$('#authErr').textContent=error.message.includes('Invalid login')?'E-mail ou mot de passe incorrect.':error.message;
  else if(signup&&!(await sb.auth.getSession()).data.session)$('#authErr').textContent='Compte créé. Vérifie tes e-mails puis connecte-toi.';
};
$('#authPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#authBtn').click();});

sb.auth.onAuthStateChange((_e,session)=>{
  S.user=session?.user||null;
  if(S.user){$('#auth').classList.add('hidden');$('#app').style.display='block';loadData();}
  else{$('#app').style.display='none';$('#auth').classList.remove('hidden');}
});

// applique le thème choisi (clair / sombre / système)
applyTheme();
// injecte les icônes de la barre de navigation
document.querySelectorAll('[data-ic]').forEach(b=>b.insertAdjacentHTML('afterbegin',navIc(b.dataset.ic)));
// précharge l'agenda éco quand on ouvre l'onglet
document.addEventListener('click',e=>{if(e.target.closest('[data-view="econ"]'))loadEcon();},true);
</script>
</body>
</html>
