<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Trading Journal</title>
<style>
:root{
  --bg:#060708; --bg2:#0d0e10; --surface:#141518; --surface2:#1b1d21;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.10);
  --text:#f2f3f5; --muted:#8a8f98; --muted2:#565a61;
  --blue:#3b82f6; --blue2:#2563eb; --blueSoft:rgba(59,130,246,.14);
  --win:#3fb860; --loss:#e5484d; --gold:#3b82f6;
  --r:16px; --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.mono{font-family:var(--mono)}
.win{color:var(--win)} .loss{color:var(--loss)} .muted{color:var(--muted)} .blue{color:var(--blue)}
.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;transition:transform .12s,opacity .12s,background .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#5b9df8,#2e6fe0);color:#fff}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:rgba(229,72,77,.12);color:var(--loss);border:1px solid rgba(229,72,77,.3)}
.btn:disabled{opacity:.45;cursor:default}
.label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--text);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.15);background-size:cover;background-position:center}
.chip{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#5b9df8,#2e6fe0);color:#fff;border-color:transparent}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--win)}
.sync.busy .dot{background:#e6a23c} .sync.off .dot{background:var(--loss)}
h1.page{font-size:24px;font-weight:600;margin:0}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.tile:active{transform:scale(.99)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--blueSoft);display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none}

/* layout */
#app{display:none;min-height:100%}
.shell{display:flex;min-height:100vh}
.side{width:230px;flex:none;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700}
.side .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b9df8,#2e6fe0);display:flex;align-items:center;justify-content:center}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.navitem.on{background:var(--blueSoft);color:var(--blue)}
.navitem svg{width:20px;height:20px}
.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:24px 32px 70px;width:100%}
.dash{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#view-history,#view-objectives,#view-econ,#view-friends,#view-settings{max-width:780px;margin:0 auto}
@media(min-width:1080px){
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .dash>.span2{grid-column:1 / -1}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
.bottombar{display:none}

@media(max-width:860px){
  .side{display:none}
  .main{max-width:100%;padding:14px 14px 96px}
  .bottombar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:rgba(20,21,24,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:999px;padding:8px 6px;align-items:center;justify-content:space-around;z-index:50}
  .bottombar .navitem{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;border-radius:999px}
  .bottombar .navitem.on{background:transparent;color:var(--blue)}
  .bottombar .navitem svg{width:21px;height:21px}
  .bottombar .add{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#5b9df8,#2e6fe0);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
}
.addfab{display:none}
@media(min-width:861px){ .side .addbtn{margin-top:8px} }

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
@media(min-width:861px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px}
@media(min-width:861px){.modal{border-radius:20px}}
.modal h2{margin:0 0 4px;font-size:18px}
.modalhead{display:flex;align-items:center;margin-bottom:16px}

/* equity */
svg.equity{width:100%;height:190px;display:block;overflow:visible}
.eq-tip{position:absolute;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;font-size:12px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .1s}
.eq-wrap{position:relative}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}
.bars>div{flex:1;border-radius:3px 3px 0 0;min-height:2px}

table{width:100%;border-collapse:collapse}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;z-index:200;font-size:14px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="auth-wrap">
  <div style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5b9df8"/><stop offset="1" stop-color="#2e6fe0"/></linearGradient></defs><path d="M3 17l5-5 4 3 8-9"/><path d="M17 3h4v4"/></svg>
      </div>
      <h1 style="margin:0;font-size:24px">Trading Journal</h1>
      <p class="muted" id="authSub" style="margin:4px 0 0">Bon retour</p>
    </div>
    <div class="field"><input id="authEmail" type="email" placeholder="E-mail" autocomplete="email"></div>
    <div class="field"><input id="authPass" type="password" placeholder="Mot de passe" autocomplete="current-password"></div>
    <div id="authErr" class="loss" style="font-size:13px;text-align:center;min-height:18px;margin-bottom:8px"></div>
    <button id="authBtn" class="btn btn-primary" style="width:100%;height:50px">Se connecter</button>
    <button id="authToggle" class="blue" style="width:100%;margin-top:14px;font-weight:600">Créer un compte</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <!-- sidebar (desktop) -->
    <aside class="side">
      <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-9"/><path d="M17 3h4v4"/></svg></span> Trading Journal</div>
      <button class="navitem" data-view="analytics" data-ic="chart"><span>Analytics</span></button>
      <button class="navitem" data-view="history" data-ic="clock"><span>Historique</span></button>
      <button class="navitem" data-view="objectives" data-ic="target"><span>Objectifs</span></button>
      <button class="navitem" data-view="econ" data-ic="cal"><span>Agenda éco</span></button>
      <button class="navitem" data-view="friends" data-ic="users"><span>Amis</span></button>
      <button class="navitem addbtn btn-primary" id="newTradeSide" style="color:#fff;justify-content:center">+ Nouveau trade</button>
      <div class="spacer"></div>
      <button class="navitem" data-view="settings" data-ic="gear"><span>Réglages</span></button>
      <div class="sync" id="syncSide" style="padding:8px 12px"><span class="dot"></span><span>Synchronisé</span></div>
    </aside>

    <!-- main content -->
    <main class="main">
      <div id="view-analytics" class="view"></div>
      <div id="view-history" class="view hidden"></div>
      <div id="view-objectives" class="view hidden"></div>
      <div id="view-econ" class="view hidden"></div>
      <div id="view-friends" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
    </main>
  </div>

  <!-- bottom bar (mobile) -->
  <nav class="bottombar">
    <button class="navitem" data-view="analytics" data-ic="chart"><span>Analytics</span></button>
    <button class="navitem" data-view="history" data-ic="clock"><span>Histo.</span></button>
    <button class="add" id="newTradeFab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="navitem" data-view="econ" data-ic="cal"><span>Agenda</span></button>
    <button class="navitem" data-view="friends" data-ic="users"><span>Amis</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://jycgmgavrernxgrmczya.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5Y2dtZ2F2cmVybnhncm1jenlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTcyMTksImV4cCI6MjA5NzQzMzIxOX0.GNvm0KIXdRKYnXNTWJt7WggoFDA2TMtbVlSK-YtrPis";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- state ---------- */
const S = { user:null, trades:[], capital:0, goals:{}, profile:null,
            friendships:[], profilesById:{}, leaderboard:[], incoming:[], outgoing:new Set(),
            econ:[], view:'analytics', filter:{result:'all',side:'all',session:null,q:''},
            lb:{period:'week',metric:'gainPct'}, econF:{impact:'all',cur:new Set()} };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const eur = v => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(v||0);
const eurS = v => (v>0?'+':'')+eur(v);
const numf = v => (v==null||v===''||isNaN(v))?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2});
const pct = v => Math.round(v*100)+' %';
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v===null||v===undefined||v==='')?null:Number(v);
const pnlCls = v => v>0?'win':v<0?'loss':'muted';
function navIc(k){const I={chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 5.5a3.5 3.5 0 010 7M22 20a6 6 0 00-5-5.9"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1L14.5 2h-5l-.3 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.4L3 11a7 7 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.3 2.5h5l.3-2.5a7 7 0 001.7-1l2.4 1 2-3.4-2-1.6a7 7 0 00.1-1z"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function setSync(k){document.querySelectorAll('.sync').forEach(e=>{e.className='sync'+(k==='busy'?' busy':k==='off'?' off':'');e.querySelector('span:last-child').textContent=k==='busy'?'Synchro…':k==='off'?'Hors ligne':'Synchronisé';});}
function plannedRR(e,sl,tp){if([e,sl,tp].some(v=>v==null||isNaN(v)))return null;const risk=Math.abs(e-sl),rew=Math.abs(tp-e);return risk<=0?null:rew/risk;}

/* period helpers */
function weekStart(){const d=new Date();const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return d.toISOString().slice(0,10);}
function monthPrefix(){return new Date().toISOString().slice(0,7);}
function inPeriod(t,p){const dt=t.date||'';if(p==='week')return dt>=weekStart();if(p==='month')return dt.startsWith(monthPrefix());return true;}

/* ---------- metrics ---------- */
function stats(trades, cap){
  let pnl=0,w=0,l=0,be=0,gw=0,gl=0,best=0,worst=0;
  trades.forEach(t=>{const p=Number(t.pnl)||0;pnl+=p;if(p>0){w++;gw+=p}else if(p<0){l++;gl+=Math.abs(p)}else be++;best=Math.max(best,p);worst=Math.min(worst,p)});
  const n=trades.length, dec=w+l;
  return {n,w,l,be,pnl,cap:cap+pnl,winRate:dec?w/dec:0,pf:gl>0?gw/gl:null,
    avgWin:w?gw/w:0,avgLoss:l?gl/l:0,best,worst,exp:n?pnl/n:0,
    wlr:gl>0&&l>0&&w>0?(gw/w)/(gl/l):null};
}
function equity(trades,cap){let c=cap;const pts=[{i:0,c,date:null}];trades.forEach((t,i)=>{c+=Number(t.pnl)||0;pts.push({i:i+1,c,date:t.date})});return pts;}
function maxDD(pts){let peak=pts[0]?.c||0,dd=0;pts.forEach(p=>{peak=Math.max(peak,p.c);dd=Math.max(dd,peak-p.c)});return dd;}
function streak(trades){let s=0;for(let i=trades.length-1;i>=0;i--){const p=Number(trades[i].pnl)||0;if(p===0)break;const win=p>0;if(s===0)s=win?1:-1;else if((s>0)===win)s+=win?1:-1;else break;}return s;}
function sessionBreak(trades){const order=['Asie','Londres','New York','Overlap','—'];const m={};trades.forEach(t=>{const k=t.session||'—';(m[k]=m[k]||{pnl:0,n:0,w:0});m[k].pnl+=Number(t.pnl)||0;m[k].n++;if((Number(t.pnl)||0)>0)m[k].w++;});return Object.keys(m).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0))).map(k=>({name:k,...m[k]}));}

/* ---------- data layer ---------- */
async function loadData(){
  setSync('busy');
  const {data:trades,error}=await sb.from('trades').select('*').eq('user_id',S.user.id).order('date',{ascending:true}).order('created_at',{ascending:true});
  if(error){setSync('off');console.error(error);return;}
  S.trades=(trades||[]);
  let {data:st}=await sb.from('settings').select('*').eq('user_id',S.user.id).maybeSingle();
  if(!st){await sb.from('settings').insert({user_id:S.user.id,capital_initial:0});S.capital=0;}
  else S.capital=Number(st.capital_initial)||0;
  const {data:g}=await sb.from('user_goals').select('*').eq('user_id',S.user.id).maybeSingle();
  S.goals=g?{weeklyPnl:num(g.weekly_pnl),targetCapital:num(g.target_capital),monthlyPnl:num(g.monthly_pnl),winRate:num(g.win_rate),monthlyTrades:num(g.monthly_trades)}:{};
  setSync('ok');
  render();
  loadSocial();
}
async function tradeRow(t){return {date:t.date||null,side:t.side,session:t.session,instrument:t.instrument,entry:t.entry,sl:t.sl,tp:t.tp,exit:t.exit,lot:t.lot,pnl:t.pnl,note:t.note};}
async function saveTrade(t,id){
  setSync('busy');const row=await tradeRow(t);
  if(id){const {data,error}=await sb.from('trades').update(row).eq('id',id).select().single();if(error){setSync('off');toast('Erreur');return;}S.trades=S.trades.map(x=>x.id===id?data:x);}
  else{const {data,error}=await sb.from('trades').insert(row).select().single();if(error){setSync('off');toast('Erreur : '+error.message);return;}S.trades.push(data);S.trades.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created_at||'').localeCompare(b.created_at||''));}
  setSync('ok');render();toast(id?'Trade modifié':'Trade ajouté');
}
async function deleteTrade(id){setSync('busy');const {error}=await sb.from('trades').delete().eq('id',id);if(error){setSync('off');return;}S.trades=S.trades.filter(x=>x.id!==id);setSync('ok');render();toast('Trade supprimé');}
async function saveCapital(v){S.capital=v;setSync('busy');await sb.from('settings').upsert({user_id:S.user.id,capital_initial:v});setSync('ok');render();}
async function saveGoals(g){S.goals=g;setSync('busy');await sb.from('user_goals').upsert({user_id:S.user.id,weekly_pnl:g.weeklyPnl,target_capital:g.targetCapital,monthly_pnl:g.monthlyPnl,win_rate:g.winRate,monthly_trades:g.monthlyTrades});setSync('ok');render();toast('Objectifs enregistrés');}

/* social */
async function loadSocial(){
  const {data:me}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=me||null;
  if(!me){render();return;}
  const {data:fs}=await sb.from('friendships').select('*');
  S.friendships=fs||[];
  const acc=[],inc=[],out=new Set();
  (fs||[]).forEach(f=>{if(f.status==='accepted')acc.push(f.requester_id===S.user.id?f.addressee_id:f.requester_id);else if(f.addressee_id===S.user.id)inc.push(f);else if(f.requester_id===S.user.id)out.add(f.addressee_id);});
  S.outgoing=out;
  const need=new Set([...acc,S.user.id]);inc.forEach(f=>need.add(f.requester_id));
  const ids=[...need];
  const {data:profs}=ids.length?await sb.from('profiles').select('*').in('id',ids):{data:[]};
  S.profilesById={};(profs||[]).forEach(p=>S.profilesById[p.id]=p);
  const {data:tr}=await sb.rpc('social_trades');
  const {data:se}=await sb.rpc('social_settings');
  const byUser={};(tr||[]).forEach(t=>{(byUser[t.user_id]=byUser[t.user_id]||[]).push(t)});
  const capBy={};(se||[]).forEach(s=>capBy[s.user_id]=Number(s.capital_initial)||0);
  S.leaderboard=[S.user.id,...acc].filter(id=>S.profilesById[id]).map(id=>({profile:S.profilesById[id],trades:byUser[id]||[],cap:capBy[id]||0,isMe:id===S.user.id}));
  S.incoming=inc.map(f=>({f,profile:S.profilesById[f.requester_id]})).filter(x=>x.profile);
  render();
}
function lbMetric(e,m,p){const t=e.trades.filter(x=>inPeriod(x,p));const s=stats(t,e.cap);if(m==='gainPct')return e.cap>0?s.pnl/e.cap*100:0;if(m==='winRate')return s.winRate*100;return s.pnl;}
function lbLabel(e,m,p){const v=lbMetric(e,m,p);if(m==='gainPct')return (v>0?'+':'')+v.toFixed(1)+' %';if(m==='winRate')return Math.round(v)+' %';return eurS(v);}

/* avatar html */

function equitySVG(pts){
  if(pts.length<2)return `<div class="muted" style="height:190px;display:flex;align-items:center;justify-content:center">Ajoute un trade pour voir la courbe</div>`;
  const W=600,H=190,pad=6;const xs=pts.map(p=>p.c);const mn=Math.min(...xs),mx=Math.max(...xs),rg=mx-mn||1;
  const X=i=>pad+i/(pts.length-1)*(W-2*pad);const Y=c=>H-pad-(c-mn)/rg*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.c).toFixed(1)}`).join(' ');
  const area=line+` L${X(pts.length-1)},${H} L${X(0)},${H} Z`;
  return `<svg class="equity" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#eg)"/><path d="${line}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle id="eqDot" r="4" fill="#3b82f6" cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1].c)}"/></svg><div class="eq-tip" id="eqTip"></div>`;
}
function hookEquity(){
  const wrap=$('#eqWrap'),svg=wrap?.querySelector('svg');if(!svg)return;
  const pts=equity(S.trades,S.capital);if(pts.length<2)return;
  const tip=$('#eqTip'),dot=$('#eqDot');
  wrap.onpointermove=e=>{const r=svg.getBoundingClientRect();const rel=(e.clientX-r.left)/r.width;const i=Math.round(rel*(pts.length-1));if(i<0||i>=pts.length)return;const p=pts[i];const x=i/(pts.length-1)*r.width;
    $('#eqVal').textContent=eur(p.c);tip.textContent=(p.date?p.date+' · ':'')+eur(p.c);tip.style.left=x+'px';tip.style.top='8px';tip.style.opacity=1;};
  wrap.onpointerleave=()=>{tip.style.opacity=0;$('#eqVal').textContent='';};
}
function pnlBars(trades){const mx=Math.max(1,...trades.map(t=>Math.abs(Number(t.pnl)||0)));return trades.map(t=>{const p=Number(t.pnl)||0;return `<div title="${eurS(p)}" style="height:${Math.max(2,Math.abs(p)/mx*100)}%;background:${p>=0?'var(--win)':'var(--loss)'}"></div>`;}).join('');}

/* ---- history ---- */
function renderHistory(){
  const f=S.filter;const active=f.result!=='all'||f.side!=='all'||f.session||f.q;
  let items=[...S.trades].reverse().filter(t=>{const p=Number(t.pnl)||0;
    if(f.result==='win'&&!(p>0))return false;if(f.result==='loss'&&!(p<0))return false;if(f.result==='be'&&p!==0)return false;
    if(f.side!=='all'&&t.side!==f.side)return false;if(f.session&&t.session!==f.session)return false;
    if(f.q&&!((t.instrument||'')+' '+(t.note||'')).toLowerCase().includes(f.q.toLowerCase()))return false;return true;});
  $('#view-history').innerHTML=`
    <div class="row" style="margin-bottom:14px"><h1 class="page">Historique</h1><div class="spacer"></div>
      <span class="pill" style="background:var(--surface);border:1px solid var(--line)">${items.length}</span>

function tradeRowHTML(t){const side=t.side&&t.side!=='na'?`<span class="pill" style="background:${t.side==='buy'?'rgba(63,184,96,.14)':'rgba(229,72,77,.14)'};color:${t.side==='buy'?'var(--win)':'var(--loss)'};font-size:10px">${t.side.toUpperCase()}</span>`:'';

    <div style="width:4px;height:40px;border-radius:3px;background:${(Number(t.pnl)||0)>0?'var(--win)':(Number(t.pnl)||0)<0?'var(--loss)':'var(--muted2)'}"></div>

    <div class="spacer"></div><span class="mono ${pnlCls(Number(t.pnl))}" style="font-weight:600">${eurS(Number(t.pnl)||0)}</span></button>`;

/* ---- objectives ---- */
function goalItems(){const out=[];const s=stats(S.trades,S.capital);const mt=S.trades.filter(t=>inPeriod(t,'month'));const mp=mt.reduce((a,t)=>a+(Number(t.pnl)||0),0);const wp=S.trades.filter(t=>inPeriod(t,'week')).reduce((a,t)=>a+(Number(t.pnl)||0),0);
  const g=S.goals;const add=(t,cur,tar,fmt)=>{if(tar!=null)out.push({t,cur,tar,r:Math.min(1,Math.max(0,tar>0?cur/tar:0)),fmt});};
  add('Objectif de la semaine',wp,g.weeklyPnl,eurS);add('Objectif de capital',s.cap,g.targetCapital,eur);add('Gain ce mois-ci',mp,g.monthlyPnl,eurS);add('Win rate visé',s.winRate*100,g.winRate,v=>Math.round(v)+' %');add('Trades ce mois',mt.length,g.monthlyTrades,v=>Math.round(v));return out;}

/* ---- econ ---- */
function renderEcon(){
  const f=S.econF;const minL={all:0,'mediumPlus':2,'high':3}[f.impact];
  let evs=S.econ.filter(e=>impactLevel(e)>=minL&&(f.cur.size===0||f.cur.has(e.country)));
  const groups=[];evs.forEach(e=>{const k=(e.date||'').slice(0,10);if(groups.length&&groups[groups.length-1].k===k)groups[groups.length-1].items.push(e);else groups.push({k,items:[e]});});
  const curs=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
  $('#view-econ').innerHTML=`
    <div class="row" style="margin-bottom:12px"><h1 class="page">Agenda éco</h1><div class="spacer"></div><button class="btn btn-ghost" id="econRefresh" style="padding:8px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-3-6.7L21 7"/><path d="M21 3v4h-4"/></svg></button></div>
    <div class="row" style="gap:6px;margin-bottom:10px">${[['all','Tous'],['mediumPlus','Moyen+'],['high','Élevé']].map(([k,l])=>`<button class="chip ${f.impact===k?'on':''}" data-impact="${k}">${l}</button>`).join('')}</div>
    <div class="row" style="gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">${curs.map(c=>`<button class="chip ${f.cur.has(c)?'on':''}" data-cur="${c}">${c}</button>`).join('')}</div>
    ${S.econLoading?'<div class="muted" style="text-align:center;padding:40px">Chargement…</div>':
      S.econErr?`<div class="muted" style="text-align:center;padding:40px">${esc(S.econErr)}<br><button class="blue" id="econRetry" style="margin-top:10px;font-weight:600">Réessayer</button></div>`:
      groups.length?groups.map(g=>`<div class="label" style="margin:14px 0 6px">${econDayLabel(g.k)}</div>${g.items.map(e=>econRow(e)).join('')}`).join(''):
      '<div class="muted" style="text-align:center;padding:40px">Aucun événement pour ces filtres</div>'}`;
}
function impactLevel(e){return {high:3,medium:2,low:1}[(e.impact||'').toLowerCase()]||0;}
function impactColor(e){return [, 'var(--muted2)','#e0c84a','#e6a23c','var(--loss)'][impactLevel(e)+1]||'var(--muted2)';}
function econDayLabel(k){if(!k)return '';const d=new Date(k+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((d-t)/864e5);if(diff===0)return "AUJOURD'HUI";if(diff===1)return 'DEMAIN';if(diff===-1)return 'HIER';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}).toUpperCase();}
function econRow(e){const time=e.date?new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
  return `<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 14px">
    <span style="width:9px;height:9px;border-radius:50%;background:${impactColor(e)};flex:none"></span>
    <span class="mono muted" style="width:46px;font-size:13px">${time}</span>
    <span class="pill" style="background:var(--surface2);font-size:11px">${esc(e.country)}</span>
    <div style="min-width:0"><div style="font-size:14px">${esc(e.title)}</div>${(e.forecast||e.previous)?`<div class="muted" style="font-size:11px">${e.forecast?'Prév. '+esc(e.forecast):''} ${e.previous?'· Préc. '+esc(e.previous):''}</div>`:''}</div></div>`;
}
async function loadEcon(force){
  if(S.econ.length&&!force)return render();
  S.econLoading=true;S.econErr=null;if(S.view==='econ')render();
  try{
    const fetchWk=async name=>{const u='https://api.allorigins.win/raw?url='+encodeURIComponent('https://nfs.faireconomy.media/'+name);const r=await fetch(u);if(!r.ok)throw 0;return r.json();};
    let all=await fetchWk('ff_calendar_thisweek.json');
    try{all=all.concat(await fetchWk('ff_calendar_nextweek.json'));}catch(e){}
    S.econ=all.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  }catch(e){S.econErr='Impossible de charger le calendrier (réessaie).';}
  S.econLoading=false;render();
}

    ${S.profile?`<div class="card row" style="margin-bottom:12px">${avatar(S.profile,56)}<div><b style="font-weight:600">${esc(S.profile.display_name)}</b><div class="muted" style="font-size:12px">@${esc(S.profile.username)}</div></div><div class="spacer"></div><label class="btn btn-primary" style="padding:9px 14px">Photo<input id="avatarInput" type="file" accept="image/*" style="display:none"></label></div>`:''}
    <div class="card" style="margin-bottom:12px"><div class="label" style="margin-bottom:8px">Capital initial</div><div class="row"><input id="capInput" class="mono" type="number" value="${S.capital}" style="background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);flex:1"><span class="muted">€</span><button class="btn btn-primary" id="capSave" style="padding:10px 16px">OK</button></div></div>
    <div class="card row" style="margin-bottom:12px"><span class="muted">E-mail</span><div class="spacer"></div><span>${esc(S.user.email)}</span></div>
    <button class="btn btn-danger" id="signout" style="width:100%">Se déconnecter</button>`;
}

/* ============ MODALS ============ */
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`;$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeModal();};}
function closeModal(){$('#modalRoot').innerHTML='';}

function tradeModal(t){
  t=t||{date:new Date().toISOString().slice(0,10),side:'buy',session:'Londres',instrument:'XAU/USD'};
  const f=n=>t[n]??'';
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Annuler</button><div class="spacer"></div><b>${t.id?'Modifier':'Nouveau trade'}</b><div class="spacer"></div><button class="blue" id="saveTrade" style="font-weight:600">Enreg.</button></div>
    <div class="grid2"><div class="field"><span class="label">Entrée</span><input id="t_entry" type="number" step="any" value="${f('entry')}"></div><div class="field"><span class="label">Stop loss</span><input id="t_sl" type="number" step="any" value="${f('sl')}"></div></div>
    <div class="grid2"><div class="field"><span class="label">Take profit</span><input id="t_tp" type="number" step="any" value="${f('tp')}"></div><div class="field"><span class="label">R:R</span><input id="t_rr" disabled value="—" style="opacity:.7"></div></div>
    <div class="field"><span class="label">Gain / Perte (€)</span><input id="t_pnl" type="number" step="any" value="${f('pnl')}" placeholder="+12,40 / -8,00" style="font-size:20px" class="mono"></div>
    <button class="btn btn-ghost" id="moreBtn" style="width:100%;margin-bottom:12px">Plus de détails ▾</button>
    <div id="more" class="hidden">
      <div class="field"><span class="label">Date</span><input id="t_date" type="date" value="${f('date')}"></div>
      <div class="field"><span class="label">Sens</span><select id="t_side"><option value="buy">BUY</option><option value="sell">SELL</option><option value="na">—</option></select></div>
      <div class="field"><span class="label">Session</span><select id="t_session">${['Asie','Londres','New York','Overlap','—'].map(s=>`<option ${t.session===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><span class="label">Instrument</span><input id="t_inst" value="${esc(f('instrument'))}"></div>
      <div class="grid2"><div class="field"><span class="label">Sortie</span><input id="t_exit" type="number" step="any" value="${f('exit')}"></div><div class="field"><span class="label">Lot</span><input id="t_lot" type="number" step="any" value="${f('lot')}"></div></div>
      <div class="field"><span class="label">Note</span><textarea id="t_note" rows="3">${esc(f('note'))}</textarea></div>
    </div>
    ${t.id?`<button class="btn btn-danger" id="delTrade" style="width:100%;margin-top:8px">Supprimer le trade</button>`:''}`);
  $('#t_side').value=t.side||'buy';
  const rr=()=>{const v=plannedRR(num($('#t_entry').value),num($('#t_sl').value),num($('#t_tp').value));$('#t_rr').value=v?v.toFixed(2)+' R':'—';};
  ['t_entry','t_sl','t_tp'].forEach(id=>$('#'+id).oninput=rr);rr();
  $('#moreBtn').onclick=()=>{$('#more').classList.toggle('hidden');};
  $('#saveTrade').onclick=async()=>{const pnl=num($('#t_pnl').value);if(pnl==null){toast('Indique le P&L');return;}
    await saveTrade({date:$('#t_date')?.value||t.date,side:$('#t_side')?.value||t.side||'buy',session:$('#t_session')?.value||t.session,instrument:$('#t_inst')?.value||t.instrument,entry:num($('#t_entry').value),sl:num($('#t_sl').value),tp:num($('#t_tp').value),exit:num($('#t_exit')?.value),lot:num($('#t_lot')?.value),pnl,note:$('#t_note')?.value||null},t.id);closeModal();};
  if(t.id)$('#delTrade').onclick=async()=>{if(confirm('Supprimer ce trade ?')){await deleteTrade(t.id);closeModal();}};
}
window.__close=closeModal;

function goalsModal(){
  const g=S.goals;
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Annuler</button><div class="spacer"></div><b>Mes objectifs</b><div class="spacer"></div><button class="blue" id="gSave" style="font-weight:600">Enreg.</button></div>
    <p class="muted" style="font-size:13px;margin:0 0 14px">Laisse vide un objectif que tu ne veux pas suivre.</p>
    <div class="field"><span class="label">Gain cette semaine (€)</span><input id="g_week" type="number" step="any" value="${g.weeklyPnl??''}"></div>
    <div class="field"><span class="label">Gain ce mois (€)</span><input id="g_month" type="number" step="any" value="${g.monthlyPnl??''}"></div>
    <div class="field"><span class="label">Objectif de capital (€)</span><input id="g_cap" type="number" step="any" value="${g.targetCapital??''}"></div>
    <div class="field"><span class="label">Win rate visé (%)</span><input id="g_wr" type="number" step="any" value="${g.winRate??''}"></div>
    <div class="field"><span class="label">Trades ce mois</span><input id="g_mt" type="number" step="any" value="${g.monthlyTrades??''}"></div>`);
  $('#gSave').onclick=async()=>{await saveGoals({weeklyPnl:num($('#g_week').value),monthlyPnl:num($('#g_month').value),targetCapital:num($('#g_cap').value),winRate:num($('#g_wr').value),monthlyTrades:num($('#g_mt').value)});closeModal();};
}

function addFriendModal(){
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Fermer</button><div class="spacer"></div><b>Ajouter un ami</b><div class="spacer"></div><span></span></div>
    <div class="field"><span class="label">Pseudo</span><input id="afQuery" placeholder="pseudo de l'ami" autocapitalize="none"></div>
    <button class="btn btn-primary" id="afSearch" style="width:100%">Rechercher</button>
    <div id="afResult" style="margin-top:14px"></div>`);
  $('#afSearch').onclick=async()=>{const q=$('#afQuery').value.trim().toLowerCase();if(q.length<3)return;
    const {data}=await sb.from('profiles').select('*').eq('username',q).maybeSingle();
    const r=$('#afResult');if(!data){r.innerHTML='<div class="muted">Aucun profil « @'+esc(q)+' »</div>';return;}
    const sent=S.outgoing.has(data.id)||data.id===S.user.id;
    r.innerHTML=`<div class="card row">${avatar(data,46)}<div><b style="font-weight:600">${esc(data.display_name)}</b><div class="muted" style="font-size:12px">@${esc(data.username)}</div></div><div class="spacer"></div>${data.id===S.user.id?'<span class="muted">Toi</span>':sent?'<span class="win">Envoyée ✓</span>':`<button class="btn btn-primary" id="afSend" style="padding:8px 14px">Ajouter</button>`}</div>`;
    if($('#afSend'))$('#afSend').onclick=async()=>{await sb.from('friendships').insert({requester_id:S.user.id,addressee_id:data.id});S.outgoing.add(data.id);toast('Demande envoyée');$('#afSend').outerHTML='<span class="win">Envoyée ✓</span>';};
  };
}

function friendModal(id){
  const e=S.leaderboard.find(x=>x.profile.id===id);if(!e)return;const me=S.leaderboard.find(x=>x.isMe);
  const s=stats(e.trades,e.cap);const p=S.lb.period;
  const cmp=(m)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="mono ${lbMetric(me,m,p)>=lbMetric(e,m,p)?'win':'muted'}" style="flex:1">${lbLabel(me,m,p)}</span><span class="muted" style="font-size:12px">${{gainPct:'% Gain',winRate:'Win rate',pnl:'P&L'}[m]}</span><span class="mono ${lbMetric(e,m,p)>=lbMetric(me,m,p)?'win':'muted'}" style="flex:1;text-align:right">${lbLabel(e,m,p)}</span></div>`;
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Fermer</button><div class="spacer"></div><b>@${esc(e.profile.username)}</b><div class="spacer"></div><span></span></div>
    <div style="text-align:center;margin-bottom:16px">${avatar(e.profile,84)}<div style="font-size:20px;font-weight:600;margin-top:8px">${esc(e.profile.display_name)}</div>${e.profile.bio?`<div class="muted" style="font-size:13px">${esc(e.profile.bio)}</div>`:''}</div>
    <div class="grid2" style="margin-bottom:14px">${kpi('Capital',eur(s.cap))}${kpi('P&L total',eurS(s.pnl),pnlCls(s.pnl))}${kpi('Win rate',pct(s.winRate),'blue')}${kpi('Trades',s.n)}</div>
    ${!e.isMe&&me?`<div class="card"><div class="label" style="margin-bottom:8px">Toi vs ${esc(e.profile.display_name)} · ${{week:'Semaine',month:'Mois',all:'Global'}[p]}</div>${cmp('gainPct')}${cmp('winRate')}${cmp('pnl')}</div>`:''}`);
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view]');if(t){S.view=t.dataset.view;render();}
  const tr=e.target.closest('[data-trade]');if(tr){const id=tr.dataset.trade;tradeModal(S.trades.find(x=>x.id===id));}
  if(e.target.closest('#newTradeSide')||e.target.closest('#newTradeFab'))tradeModal();
  if(e.target.closest('#filterBtn'))filterModal();
  const cl=e.target.closest('[data-clear]');if(cl){const k=cl.dataset.clear;S.filter[k]=k==='q'?'':(k==='result'||k==='side')?'all':null;render();}
  if(e.target.closest('#clearAll')){S.filter={result:'all',side:'all',session:null,q:''};render();}
  if(e.target.closest('#editGoals'))goalsModal();
  const imp=e.target.closest('[data-impact]');if(imp){S.econF.impact=imp.dataset.impact;render();}
  const cur=e.target.closest('[data-cur]');if(cur){const c=cur.dataset.cur;S.econF.cur.has(c)?S.econF.cur.delete(c):S.econF.cur.add(c);render();}
  if(e.target.closest('#econRefresh')||e.target.closest('#econRetry'))loadEcon(true);
  const per=e.target.closest('[data-period]');if(per){S.lb.period=per.dataset.period;render();}
  const met=e.target.closest('[data-metric]');if(met){S.lb.metric=met.dataset.metric;render();}
  if(e.target.closest('#addFriend'))addFriendModal();
  const fr=e.target.closest('[data-friend]');if(fr)friendModal(fr.dataset.friend);
  const ac=e.target.closest('[data-accept]');if(ac)acceptFriend(ac.dataset.accept);
  const dc=e.target.closest('[data-decline]');if(dc)declineFriend(dc.dataset.decline);
  if(e.target.closest('#capSave')){const v=Number($('#capInput').value)||0;saveCapital(v);toast('Capital enregistré');}
  if(e.target.closest('#signout'))sb.auth.signOut();
  if(e.target.closest('#cpSave'))createProfile();
});
document.addEventListener('change',e=>{
  if(e.target.id==='avatarInput'&&e.target.files[0])uploadAvatar(e.target.files[0]);
});
function filterModal(){
  const f=S.filter;
  modal(`<div class="modalhead"><button class="muted" onclick="window.__close()">Réinit.</button><div class="spacer"></div><b>Filtres</b><div class="spacer"></div><button class="blue" onclick="window.__close()" style="font-weight:600">OK</button></div>
    <div class="field"><span class="label">Recherche</span><input id="fq" placeholder="Instrument ou note" value="${esc(f.q)}"></div>
    <div class="field"><span class="label">Résultat</span><select id="fr"><option value="all">Tous</option><option value="win">Gagnants</option><option value="loss">Perdants</option><option value="be">BE</option></select></div>
    <div class="field"><span class="label">Sens</span><select id="fs"><option value="all">Tous</option><option value="buy">BUY</option><option value="sell">SELL</option></select></div>
    <div class="field"><span class="label">Session</span><select id="fses"><option value="">Toutes</option>${['Asie','Londres','New York','Overlap','—'].map(s=>`<option ${f.session===s?'selected':''}>${s}</option>`).join('')}</select></div>`);
  $('#fr').value=f.result;$('#fs').value=f.side;
  const upd=()=>{S.filter={result:$('#fr').value,side:$('#fs').value,session:$('#fses').value||null,q:$('#fq').value};render();};
  ['fq','fr','fs','fses'].forEach(id=>$('#'+id).onchange=upd);$('#fq').oninput=upd;
  $('#mbg').querySelector('.muted').onclick=()=>{S.filter={result:'all',side:'all',session:null,q:''};closeModal();render();};
}
async function acceptFriend(id){await sb.from('friendships').update({status:'accepted'}).eq('id',id);toast('Ami accepté');loadSocial();}
async function declineFriend(id){await sb.from('friendships').delete().eq('id',id);loadSocial();}
async function createProfile(){
  const u=$('#cpUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');const n=$('#cpName').value.trim();const bio=$('#cpBio').value.trim();
  if(u.length<3||u.length>20){$('#cpErr').textContent='Pseudo : 3 à 20 caractères (minuscules, chiffres, _).';return;}
  if(!n){$('#cpErr').textContent='Indique un nom affiché.';return;}
  const {error}=await sb.from('profiles').insert({id:S.user.id,username:u,display_name:n,bio:bio||null});
  if(error){$('#cpErr').textContent=error.message.includes('duplicate')||error.message.includes('unique')?'Ce pseudo est déjà pris.':error.message;return;}
  toast('Profil créé');loadSocial();
}
async function uploadAvatar(file){
  setSync('busy');
  const path=S.user.id.toLowerCase()+'/avatar.jpg';
  const {error}=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});
  if(error){setSync('off');toast('Erreur photo : '+error.message);return;}
  const {data}=sb.storage.from('avatars').getPublicURL(path);
  const url=data.publicUrl+'?t='+Date.now();
  await sb.from('profiles').update({avatar_url:url}).eq('id',S.user.id);
  setSync('ok');toast('Photo mise à jour');loadSocial();
}

/* ============ AUTH ============ */
let signup=false;
$('#authToggle').onclick=()=>{signup=!signup;$('#authBtn').textContent=signup?'Créer le compte':'Se connecter';$('#authSub').textContent=signup?'Crée ton compte':'Bon retour';$('#authToggle').textContent=signup?"J'ai déjà un compte":'Créer un compte';$('#authErr').textContent='';};
$('#authBtn').onclick=async()=>{
  const email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  $('#authErr').textContent='';$('#authBtn').disabled=true;
  const fn=signup?sb.auth.signUp({email,password:pass}):sb.auth.signInWithPassword({email,password:pass});
  const {error}=await fn;$('#authBtn').disabled=false;
  if(error)$('#authErr').textContent=error.message.includes('Invalid login')?'E-mail ou mot de passe incorrect.':error.message;
  else if(signup&&!(await sb.auth.getSession()).data.session)$('#authErr').textContent='Compte créé. Vérifie tes e-mails puis connecte-toi.';
};
$('#authPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#authBtn').click();});

sb.auth.onAuthStateChange((_e,session)=>{
  S.user=session?.user||null;
  if(S.user){$('#auth').classList.add('hidden');$('#app').style.display='block';loadData();}
  else{$('#app').style.display='none';$('#auth').classList.remove('hidden');}
});

// injecte les icônes de la barre de navigation
document.querySelectorAll('[data-ic]').forEach(b=>b.insertAdjacentHTML('afterbegin',navIc(b.dataset.ic)));
// précharge l'agenda éco quand on ouvre l'onglet
document.addEventListener('click',e=>{if(e.target.closest('[data-view="econ"]'))loadEcon();},true);
</script>
</body>
</html>
